<body>
<h1>metricalizer2</h1>
<p>Regelbasierte Metrikanalyse deutscher Gedichte. Kopfzeilen <code>#Titel:</code> und <code>#Autor:</code> sind optional; Leerzeilen trennen Strophen.</p>
<label for="poem">Gedicht</label>
<textarea id="poem" rows="18">#Titel: Mondnacht
#Autor: Joseph von Eichendorff
Es war, als hätt' der Himmel
Die Erde still geküßt,
Daß sie im Blütenschimmer
Von ihm nun träumen müßt'.

Die Luft ging durch die Felder,
Die Ähren wogten sacht,
Es rauschten leis die Wälder,
So sternklar war die Nacht.

Und meine Seele spannte
Weit ihre Flügel aus,
Flog durch die stillen Lande,
Als flöge sie nach Haus.</textarea>
<p>
<label for="meter">Metrum</label>
<select id="meter">
<option value="auto">automatisch</option>
<option value="iambic">jambisch</option>
<option value="trochaic">trochäisch</option>
<option value="dactylic">daktylisch</option>
<option value="dactylic_with_pre">daktylisch mit Auftakt</option>
<option value="anapestic">anapästisch</option>
<option value="cretic">kretisch</option>
<option value="free_filling">Senkungsfreiheit</option>
<option value="alcaic">alkäische Strophe</option>
<option value="sapphic">sapphische Strophe</option>
<option value="asclepiadean_a">asklepiadeische Strophe (2 Asklepiadeen, Pherekrateus, Glykoneus)</option>
<option value="asclepiadean_b">asklepiadeische Strophe (3 Asklepiadeen, Glykoneus)</option>
<option value="distich">Distichon</option>
<option value="free_rhythm">freie Rhythmen</option>
</select>
<button id="analyse">Analysieren</button>
</p>
<div id="result"></div>
<script type="module" src="app.js"></script>
</body>
